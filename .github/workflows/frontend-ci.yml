name: Frontend CI

on:
  pull_request:
    branches: [develop]
  push:
    branches:
      - feature/onboarding-profile-integration
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        check: [Lint, Tests, Build]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24.16.0'
          cache: npm

      - name: Set up npm
        run: npm install --global npm@11.13.0

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: matrix.check == 'Lint'
        run: npm run lint

      - name: Tests
        if: matrix.check == 'Tests'
        run: npm test -- --watch=false

      - name: Production build
        if: matrix.check == 'Build'
        run: npm run build
