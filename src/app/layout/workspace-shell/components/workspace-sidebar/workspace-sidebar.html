
<aside
  class="sidebar"
  [class.open]="menuOpen"
  [class.doctor-dashboard-sidebar]="isDoctorWorkspace"
  aria-label="Main navigation"
>
  <a
    class="brand"
    routerLink="/workspace"
    (click)="closeMenu.emit()"
    aria-label="MediLink workspace"
  >
    <img
      src="/medilink-logo-horizontal.svg"
      alt="MediLink"
    />
  </a>

  <p class="workspace-label">
    {{ activeRole }} workspace
  </p>

  <nav
    class="primary-navigation"
    aria-label="Workspace"
  >
    @for (item of navigation; track item.path) {
      <a
        [routerLink]="item.path"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{
          exact: item.path === '/workspace' ||
                 item.path === '/workspace/doctor/dashboard'
        }"
        (click)="closeMenu.emit()"
      >
        <span
          class="material-symbols-outlined"
          aria-hidden="true"
        >
          {{ item.icon }}
        </span>

        <span>{{ item.label }}</span>
      </a>
    }
  </nav>

  <div class="sidebar-footer">
    <label for="active-role">Active role</label>

    <select
      id="active-role"
      [value]="activeRole"
      (change)="selectRole($event)"
    >
      @for (role of roles; track role) {
        <option [value]="role">
          {{ role }}
        </option>
      }
    </select>

    @if (organizationContext.availableMemberships().length > 0) {
      <label for="active-organization">Active organization</label>

      <select
        id="active-organization"
        [value]="organizationContext.activeOrganizationId() ?? ''"
        (change)="selectOrganization($event)"
      >
        <option value="">Select an organization</option>

        @for (
          membership of organizationContext.availableMemberships();
          track membership.id
          ) {
          <option [value]="membership.organization_id">
            {{ membership.organization_id }}
          </option>
        }
      </select>
    }

    <span class="demo-note">
  Available roles and organizations come from your account.
</span>
  </div>
</aside>

@if (menuOpen) {
  <button
    class="sidebar-scrim"
    type="button"
    aria-label="Close navigation"
    (click)="closeMenu.emit()"
  ></button>
}
