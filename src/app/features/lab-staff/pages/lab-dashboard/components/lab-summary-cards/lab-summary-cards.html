<div class="stats" aria-label="Laboratory activity summary">
  <div class="stat accent">
    <span>Upload requests</span>
    <strong class="metric">Find request</strong>
    <small>Use a patient-shared token below</small>
  </div>

  <div class="stat">
    <span>Reports</span>
    <strong>{{ summary().totalReports }}</strong>
    <small>All statuses, authorized laboratories</small>
  </div>

  <div class="stat">
    <span>Laboratory memberships</span>
    <strong class="metric">{{ summary().laboratory }}</strong>
    <small>Approved Lab Staff memberships</small>
  </div>

  <div class="stat">
    <span>Verification</span>
    <strong class="verified">{{ summary().verification }}</strong>
    <small>Professional profile</small>
  </div>
</div>
