<aside class="sidebar" [class.open]="isOpen()" aria-label="Super Admin sidebar">
  <a class="brand" routerLink="/super-admin/organizations" (click)="closeSidebar.emit()">
    <span class="material-symbols-outlined brand-icon" aria-hidden="true">clinical_notes</span>
    <span class="brand-word">Medi<span>Link</span></span>
  </a>

  <nav class="nav" aria-label="Super Admin navigation">
    <p class="nav-heading">SUPER ADMIN WORKSPACE</p>
    @for (item of mainItems; track item.label) {
      @if (item.route) {
        <a class="nav-item" [routerLink]="item.route" routerLinkActive="active"
           [routerLinkActiveOptions]="{ exact: item.route === '/super-admin/membership-request' }"
           (click)="closeSidebar.emit()">
          <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      } @else {
        <span class="nav-item placeholder" [attr.aria-label]="item.label + ' (not implemented)'">
          <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </span>
      }
    }
  </nav>

  <div class="footer-nav" aria-label="Additional options (preview)">
    @for (item of footerItems; track item.label) {
      <span class="nav-item placeholder" [attr.aria-label]="item.label + ' (not implemented)'">
        <span class="material-symbols-outlined" aria-hidden="true">{{ item.icon }}</span>
        <span>{{ item.label }}</span>
      </span>
    }
  </div>
</aside>
