<div class="page-heading">
  <div>
    <h1>Access history</h1>
    <p>Your record and sharing activity.</p>
  </div>
  <button type="button" [disabled]="state() === 'loading'" (click)="load()">Refresh</button>
</div>
<section class="panel" aria-label="Your record activity" [attr.aria-busy]="state() === 'loading'">
  @if (error()) {
    <p role="alert">{{ error() }}</p>
  }
  @if (state() === 'ready') {
    <app-patient-activity-list [activities]="activities()" />
  } @else {
    <app-activity-state [state]="state()" emptyText="No record activity." (retry)="load()" />
  }
  @if (state() === 'ready' || state() === 'empty') {
    <app-activity-page-controls
      label="Your activity pages"
      [page]="page()"
      [total]="total()"
      [busy]="state() === 'loading'"
      (changePage)="load($event)"
    />
  }
  <a routerLink="/workspace/patient/access">← Back to access</a>
</section>
