<div class="form-field" [class.invalid]="!!error">
  <label [attr.for]="fieldId">
    {{ label }}@if (required) {<span class="required-mark" aria-hidden="true"> *</span>}
  </label>
  <div class="field-control"><ng-content></ng-content></div>
  @if (hint && !error) {
    <small class="field-hint" [id]="fieldId + '-hint'">{{ hint }}</small>
  }
  @if (error) {
    <small class="field-error" [id]="fieldId + '-error'" role="alert">{{ error }}</small>
  }
</div>
